<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抽签转盘</title>
<style>
.wrap{max-width:420px;margin:40px auto;text-align:center}
.wheel{width:300px;height:300px;border-radius:50%;background:#448aff;margin:0 auto 30px;transition: transform 4s cubic-bezier(0.2,0.8,0.2,1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold}
.btn{padding:12px 32px;font-size:18px;border:none;background:#222;color:#fff;border-radius:8px;cursor:pointer}
.btn:disabled{background:#999;cursor:not-allowed}
#result{margin-top:24px;font-size:20px;min-height:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="wheel" id="wheel">转盘</div>
  <button class="btn" id="drawBtn">点击转动抽签</button>
  <div id="result"></div>
</div>

<script>
const wheel = document.getElementById('wheel');
const drawBtn = document.getElementById('drawBtn');
const resultBox = document.getElementById('result');

// 本地标记：本机已经抽过
if(localStorage.getItem('hasDraw')){
  drawBtn.disabled = true;
  resultBox.innerText = "你已经抽取过任务啦";
}

drawBtn.onclick = async ()=>{
  drawBtn.disabled = true;
  resultBox.innerText = "转动中...";
  // 转盘随机旋转圈数
  const randomDeg = 1800 + Math.random() * 1800;
  wheel.style.transform = `rotate(${randomDeg}deg)`;

  // 等待转盘动画跑完，再请求后端拿任务
  await new Promise(resolve=>setTimeout(resolve,4000));

  try{
    const res = await fetch(`api/draw?action=draw`);
    const data = await res.json();
    if(data.success){
      localStorage.setItem('hasDraw','1');
      resultBox.innerText = `🎉你的任务：${data.task}`;
    }else{
      resultBox.innerText = data.msg;
      drawBtn.disabled = false;
    }
  }catch(e){
    resultBox.innerText = "网络请求失败，请重试";
    drawBtn.disabled = false;
  }
}
</script>
</body>
</html>
