<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抽签后台</title>
<style>
.wrap{max-width:500px;margin:40px auto}
textarea{width:100%;height:240px;padding:10px;box-sizing:border-box}
button{margin:10px 10px 0 0;padding:10px 20px}
#msg{margin-top:16px;color:#333}
.status-box{margin-top:24px;padding:16px;border:1px solid #ddd;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <h3>管理员｜任务配置</h3>
  <p>每行一条任务：</p>
  <textarea id="taskText" placeholder="任务1
任务2
任务3"></textarea>
  <br>
  <button onclick="initPool()">初始化任务池</button>
  <button onclick="resetPool()">全部清空</button>
  <button onclick="resetDrawn()">重置抽取记录（保留任务，测试用）</button>
  <div id="msg"></div>

  <div class="status-box">
    <h4>抽签进度查询</h4>
    <input type="password" id="pwdInput" placeholder="输入管理员密码">
    <button onclick="checkStatus()">查询进度</button>
    <div id="statusResult" style="margin-top:12px"></div>
  </div>
</div>

<script>
const msgBox = document.getElementById('msg');
const statusResult = document.getElementById('statusResult');
const pwdInput = document.getElementById('pwdInput');

async function initPool(){
  const text = document.getElementById('taskText').value.trim();
  if(!text) return msgBox.innerText = "请填写任务";
  const tasks = text.split('\n').filter(i=>i.trim()!=='');
  const res = await fetch(`api/draw?action=init`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tasks})
  })
  const data = await res.json();
  msgBox.innerText = data.msg;
}

async function resetPool(){
  const res = await fetch(`api/draw?action=reset`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tasks:[]})
  })
  const data = await res.json();
  msgBox.innerText = data.msg;
}

// ✅测试用：重置抽取标记
async function resetDrawn(){
  const pwd = pwdInput.value.trim();
  const res = await fetch(`api/draw?action=resetDrawn&pwd=${encodeURIComponent(pwd)}`,{
    method:"POST"
  })
  const data = await res.json();
  msgBox.innerText = data.msg;
}

async function checkStatus(){
  const pwd = pwdInput.value.trim();
  const res = await fetch(`api/draw?action=getStatus&pwd=${encodeURIComponent(pwd)}`)
  const data = await res.json();
  if(data.success){
    statusResult.innerText = `✅ 当前进度：已抽取 ${data.drawnCount} / 总共 ${data.total} 个任务`
  }else{
    statusResult.innerText = data.msg;
  }
}
</script>
</body>
</html>
