<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽签后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#1a1a2e;color:#fff;min-height:100vh;padding:30px 20px}
.box{background:#16213e;border-radius:16px;padding:24px;max-width:500px;margin:0 auto}
h2{color:#e94560;text-align:center;margin-bottom:20px}
textarea,input{width:100%;padding:12px;border-radius:8px;margin:8px 0;border:none;background:#0f3460;color:#fff}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#e94560;color:#fff;font-weight:bold;margin:6px 0;cursor:pointer}
.gray{background:#444}
.info{color:#aaa;font-size:14px;line-height:1.6;margin:10px 0}
.back{display:block;text-align:center;color:#88aaff;margin-top:16px}
</style>
</head>
<body>
<div class="box">
    <h2>主持人后台</h2>
    <div class="info">名单、任务一行一个，数量必须相等</div>
    <label>人员名单：</label>
    <textarea id="players" rows="6" placeholder="A
B
C
D"></textarea>
    <label>任务列表：</label>
    <textarea id="tasks" rows="6" placeholder="任务1
任务2
任务3
任务4"></textarea>
    <button onclick="initDraw()">开始随机分配</button>
    <button class="gray" onclick="resetAll()">清空全部抽签记录</button>
    <a class="back" href="index.html">返回抽签页</a>
</div>
<script>
const API_BASE = "";
async function initDraw(){
    const players = document.getElementById("players").value.trim().split("\n").filter(x=>x.trim());
    const tasks = document.getElementById("tasks").value.trim().split("\n").filter(x=>x.trim());
    const res = await fetch(`${API_BASE}/api/route?action=init`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({players,tasks})
    })
    const ret = await res.json();
    alert(ret.msg);
}
async function resetAll(){
    const res = await fetch(`${API_BASE}/api/route?action=reset`,{method:"POST"});
    const ret = await res.json();
    alert(ret.msg);
}
</script>
</body>
</html>
