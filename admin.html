<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>抽签后台</title>
<style>
.wrap{max-width:500px;margin:40px auto}
textarea{width:100%;height:240px;padding:10px;box-sizing:border-box}
button{margin:10px 10px 0 0;padding:10px 20px}
#msg{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h3>管理员｜任务配置</h3>
  <p>每行一条任务：</p>
  <textarea id="taskText" placeholder="任务1
任务2
任务3"></textarea>
  <br>
  <button onclick="initPool()">初始化任务池</button>
  <button onclick="resetPool()">重置清空</button>
  <div id="msg"></div>
</div>

<script>
const msgBox = document.getElementById('msg');

async function initPool(){
  const text = document.getElementById('taskText').value.trim();
  if(!text) return msgBox.innerText = "请填写任务";
  const tasks = text.split('\n').filter(i=>i.trim()!=='');
  const res = await fetch(`api/draw?action=init`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tasks})
  })
  const data = await res.json();
  msgBox.innerText = data.msg;
}

async function resetPool(){
  const res = await fetch(`api/draw?action=reset`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tasks:[]})
  })
  const data = await res.json();
  msgBox.innerText = data.msg;
}
</script>
</body>
</html>
